name: Deploy Lambda

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy-lambda:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::051495878139:role/WebsiteDeployment
          aws-region: eu-west-2

      - name: Package Lambda
        run: |
          cd lambda
          zip ../lambda.zip lambda_function.py

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name portfolio-website-enquiry-handler \
            --zip-file fileb://lambda.zip