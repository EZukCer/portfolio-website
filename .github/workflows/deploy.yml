name: Deploy website

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::051495878139:role/WebsiteDeployment
          aws-region: eu-west-2

      - name: Deploy website to S3
        run: |
          aws s3 sync . s3://ezukcer-portfolio-website-051495878139-eu-west-2-an \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"