<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        
        <div id="navbar"></div>


        <section class="page-content contact-page">
            <p class="eyebrow">Contact</p>

            <h1>Contact Me</h1>

            <form class="contact-form" id="contact-form">

                <div class="form-group honeypot" >
                    <label for="website">Website</label>
                    <input
                        type="text"
                        id="website"
                        name="website"
                        tabindex="-1"
                        autocomplete="off"
                        aria-hidden="true"
                    >
                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label for="first-name">First Name</label>

                        <input
                            type="text"
                            id="first-name"
                            name="firstName"
                            autocomplete="given-name"
                            maxlength="25"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="last-name">Last Name</label>

                        <input
                            type="text"
                            id="last-name"
                            name="lastName"
                            autocomplete="family-name"
                            maxlength="25"
                            required
                        >

                    </div>

                </div>

                <div class="form-group">

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        maxlength="50"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="reason">Reason</label>

                    <select
                        id="reason"
                        name="reason"
                        maxlength="20"
                        required
                    >
                        <option value="" disabled selected>Select a reason</option>
                        <option value="project">Project</option>
                        <option value="work">Work opportunity</option>
                        <option value="question">Question</option>
                        <option value="other">Other</option>
                    </select>

                </div>

                <div class="form-group">

                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="7"
                        maxlength="500"
                        placeholder="Tell me a little about what you'd like to discuss..."
                        required
                    ></textarea>

                    <p class="character-count">
                        Maximum 500 characters
                    </p>

                </div>

                <button type="submit">
                    Send Message <span>→</span>
                </button>

            </form>

            <div class="contact-success" id="contact-success" hidden>
                <div class="success-icon" aria-hidden="true">✓</div>

                <div>
                    <h2>Message successfully sent</h2>
                    <p>
                        Thanks for getting in touch. I'll get back to you
                        within 4 days.
                    </p>
                </div>
            </div>

            <div class="contact-error" id="contact-error" hidden>
                <div class="error-icon" aria-hidden="true">!</div>

                <div>
                    <h2>Message could not be sent</h2>
                    <p id="contact-error-message">
                        Something went wrong. Please try again.
                    </p>
                </div>
            </div>

            <div class="links">
                <a href="index.html">
                    ← Back home
                </a>
            </div>
        </section>

        <div id="footer"></div>
        
    </main>
    
    <script src="scripts/components.js"></script>
    <script src="scripts/contact.js"></script>

</body>
</html>
